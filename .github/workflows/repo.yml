name: Repo

on:
  push:
    branches: [main]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Merge main -> develop
        uses: everlytic/branch-merge@c4a244dc23143f824ae6c022a10732566cb8e973
        with:
          target_branch: develop
          github_token: ${{ secrets.REPO_TOKEN }}
